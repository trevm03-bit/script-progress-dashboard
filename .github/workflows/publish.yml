# Publishes the extension to the VS Code Marketplace whenever a version tag is pushed.
#
#   git tag v1.3.0 && git push origin v1.3.0
#
# The Marketplace token lives ONLY in this repo's Actions secrets as VSCE_PAT (Azure DevOps
# Personal Access Token, scope "Marketplace > Manage", organization "All accessible
# organizations"). Nothing here prints it. The tag must match the version in package.json.
name: Publish to Marketplace

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'   # node --test needs glob support (21+) for the test script

      # The reporter is half the product and it is Python. Without this, `npm run test:python`
      # has no interpreter and the release gate below cannot read the .vsix either.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Tag must equal package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag v$TAG does not match package.json version $PKG" >&2
            exit 1
          fi

      - name: Install build tools
        run: npm ci

      # 🔴 Every gate the repo has, not just the JavaScript one. Until 1.6.1 this job ran
      # `npm test` alone: the Python reporter's two suites and the packaged-artefact smoke gate
      # were never executed by CI at all, so a tag could be published green with the reporter
      # broken. Five separate reviews audited the smoke gate itself; none checked whether
      # anything ever ran it.
      - name: Compile and test
        run: |
          npm run compile
          npm test
          npm run test:python

      - name: Package
        run: |
          mkdir -p dist        # gitignored, so a fresh checkout has no dist/ for vsce to write into
          npm run package

      # Runs against the .vsix this job just built. --no-install because a GitHub runner has no
      # VS Code: the gate then prints a SKIP list naming every package-integrity check it could
      # not perform, so this step can never be mistaken for the full local gate. What it DOES
      # still cover is the check that would have caught the 1.6.1 leak -- it scans the .vsix
      # itself for developer-only folders and for the build machine's identity.
      # 🔴 The full `npm run smoke` on a machine with VS Code remains mandatory before the
      # .vsix is uploaded by hand.
      - name: Release gate against the packaged .vsix
        run: node scripts/smoke.js --no-install

      - name: Publish (skipped politely when no VSCE_PAT secret exists)
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "::notice::No VSCE_PAT secret — not publishing. Download the .vsix from this run's artifacts and upload it on https://marketplace.visualstudio.com/manage/publishers/trevor-marshall"
            exit 0
          fi
          npx --yes @vscode/vsce@latest publish --packagePath dist/script-progress-dashboard-${GITHUB_REF_NAME#v}.vsix

      - name: Keep the .vsix with the run
        uses: actions/upload-artifact@v4
        with:
          name: script-progress-dashboard-${{ github.ref_name }}
          path: dist/*.vsix
