# Publishes the extension to the VS Code Marketplace whenever a version tag is pushed.
#
#   git tag v1.3.0 && git push origin v1.3.0
#
# The Marketplace token lives ONLY in this repo's Actions secrets as VSCE_PAT (Azure DevOps
# Personal Access Token, scope "Marketplace > Manage", organization "All accessible
# organizations"). Nothing here prints it. The tag must match the version in package.json.
name: Publish to Marketplace

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Tag must equal package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag v$TAG does not match package.json version $PKG" >&2
            exit 1
          fi

      - name: Install build tools
        run: npm ci

      - name: Compile and test
        run: |
          npm run compile
          npm test

      - name: Package
        run: npm run package

      - name: Publish
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx --yes @vscode/vsce@latest publish --packagePath dist/script-progress-dashboard-${GITHUB_REF_NAME#v}.vsix

      - name: Keep the .vsix with the run
        uses: actions/upload-artifact@v4
        with:
          name: script-progress-dashboard-${{ github.ref_name }}
          path: dist/*.vsix
