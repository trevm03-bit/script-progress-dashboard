<!doctype html>
<meta charset="utf-8">
<title>TM monogram candidates</title>
<style>
  body { margin: 0; background: #16191b; font-family: system-ui, sans-serif; color: #c9d1d3; }
  .row { display: flex; gap: 48px; padding: 36px 40px; align-items: flex-start; }
  .cell { display: flex; flex-direction: column; gap: 14px; align-items: center; }
  .cell h3 { margin: 0; font-weight: 500; font-size: 15px; letter-spacing: .06em; color: #8fa1a4; }
  .sizes { display: flex; gap: 18px; align-items: flex-end; }
  .light { background: #f3f5f4; padding: 10px; border-radius: 10px; display: flex; gap: 18px; align-items: flex-end; }
  svg { display: block; }
</style>

<svg width="0" height="0" style="position:absolute">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e3540"/>
      <stop offset="1" stop-color="#0f5b55"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.28" cy="0.12" r="0.95">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.11"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="teal-glow">
      <stop offset="0" stop-color="#5fd3be" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#5fd3be" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ink" gradientUnits="userSpaceOnUse" x1="0" y1="130" x2="0" y2="360">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dfe9e7"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#000" flood-opacity="0.38"/>
    </filter>
    <filter id="node-glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="42.67" height="42.67" patternUnits="userSpaceOnUse">
      <path d="M42.67 0H0V42.67" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <clipPath id="tile"><rect width="512" height="512" rx="112"/></clipPath>
  </defs>
</svg>

<!--
  The monogram: T and M share one crossbar (the T's bar runs on into the top of the M), drawn
  with mitred joins so every corner is a sharp engineered point. The M's centre vertex is not
  drawn as a stroke at all: the two diagonals stop short and a teal node sits exactly where they
  would meet, the way a measured point sits on a chart. Everything else is instrument furniture.
-->

<div class="row">

<div class="cell"><h3>A · INSTRUMENT</h3>
<svg id="A" width="512" height="512" viewBox="0 0 512 512">
  <g clip-path="url(#tile)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <rect width="512" height="512" fill="url(#sheen)"/>
    <!-- hairlines from the ring outward only, so the letters stay clean -->
    <path d="M256 22V60 M256 452V490 M22 256H60 M452 256H490" stroke="#fff" stroke-opacity="0.35" stroke-width="2" stroke-linecap="round"/>
    <circle cx="256" cy="256" r="200" fill="none" stroke="#fff" stroke-opacity="0.30" stroke-width="2"/>
    <g id="ticksA" stroke="#fff" stroke-linecap="round"></g>
    <circle cx="326" cy="300" r="105" fill="url(#teal-glow)"/>
    <g fill="none" stroke="url(#ink)" stroke-width="38" stroke-linejoin="miter" stroke-miterlimit="8" filter="url(#soft)">
      <!-- shared crossbar: from the T's left end to the M's left stem -->
      <path d="M96 170H262"/>
      <path d="M170 170V352"/>
      <!-- M: left stem, then diagonals that stop short of the node, right stem -->
      <path d="M262 352V170L312 262"/>
      <path d="M340 262L390 170V352"/>
    </g>
    <!-- the node where the diagonals would meet -->
    <circle cx="326" cy="288" r="22" fill="#5fd3be" opacity="0.55" filter="url(#node-glow)"/>
    <circle cx="326" cy="288" r="19" fill="#12262b"/>
    <circle cx="326" cy="288" r="13" fill="#5fd3be"/>
  </g>
  <rect x="1" y="1" width="510" height="510" rx="111" fill="none" stroke="#fff" stroke-opacity="0.10" stroke-width="2"/>
</svg>
</div>

<div class="cell"><h3>B · SIGNAL</h3>
<svg id="B" width="512" height="512" viewBox="0 0 512 512">
  <g clip-path="url(#tile)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <rect width="512" height="512" fill="url(#grid)"/>
    <rect width="512" height="512" fill="url(#sheen)"/>
    <circle cx="404" cy="332" r="110" fill="url(#teal-glow)"/>
    <g fill="none" stroke="url(#ink)" stroke-width="38" stroke-linejoin="miter" stroke-miterlimit="8" filter="url(#soft)">
      <path d="M92 138H258"/>
      <path d="M166 138V300"/>
      <path d="M258 300V138L308 226"/>
      <path d="M336 226L386 138V300"/>
    </g>
    <circle cx="322" cy="252" r="19" fill="#12262b"/>
    <circle cx="322" cy="252" r="13" fill="#5fd3be"/>
    <!-- chart: axis, ticks, and a series that ends on a lit point under the M's right stem -->
    <path d="M92 396H420" stroke="#fff" stroke-opacity="0.28" stroke-width="3" stroke-linecap="round"/>
    <path d="M132 396v10 M172 396v10 M212 396v10 M252 396v10 M292 396v10 M332 396v10 M372 396v10" stroke="#fff" stroke-opacity="0.28" stroke-width="3" stroke-linecap="round"/>
    <path d="M92 386L136 372L178 380L222 356L262 364L306 344L346 350L386 330" fill="none" stroke="#5fd3be" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="386" cy="330" r="18" fill="#12262b"/>
    <circle cx="386" cy="330" r="12" fill="#5fd3be"/>
  </g>
  <rect x="1" y="1" width="510" height="510" rx="111" fill="none" stroke="#fff" stroke-opacity="0.10" stroke-width="2"/>
</svg>
</div>

<div class="cell"><h3>A · SMALL</h3>
<div class="sizes">
  <svg width="160" height="160" viewBox="0 0 512 512"><use href="#A"/></svg>
  <svg width="96" height="96" viewBox="0 0 512 512"><use href="#A"/></svg>
  <svg width="48" height="48" viewBox="0 0 512 512"><use href="#A"/></svg>
  <svg width="32" height="32" viewBox="0 0 512 512"><use href="#A"/></svg>
</div>
<div class="light">
  <svg width="96" height="96" viewBox="0 0 512 512"><use href="#A"/></svg>
  <svg width="48" height="48" viewBox="0 0 512 512"><use href="#A"/></svg>
  <svg width="96" height="96" viewBox="0 0 512 512"><use href="#B"/></svg>
  <svg width="48" height="48" viewBox="0 0 512 512"><use href="#B"/></svg>
</div>
</div>

</div>

<script>
  const g = document.getElementById('ticksA');
  const R = 200, cx = 256, cy = 256;
  for (let k = 0; k < 36; k++) {
    const a = (k * 10) * Math.PI / 180;
    const major = k % 9 === 0;
    const len = major ? 22 : 9;
    const l = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    l.setAttribute('x1', cx + Math.cos(a) * (R - len)); l.setAttribute('y1', cy + Math.sin(a) * (R - len));
    l.setAttribute('x2', cx + Math.cos(a) * R);         l.setAttribute('y2', cy + Math.sin(a) * R);
    l.setAttribute('stroke-width', major ? 5 : 2);
    l.setAttribute('stroke-opacity', major ? 0.9 : 0.35);
    g.appendChild(l);
  }
</script>
